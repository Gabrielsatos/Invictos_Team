<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4º Invictos Team – Card de lutas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:ital,wght@1,800;1,900&display=swap">
<style>
:root{--bg:#0d0d0f;--panel:#17171a;--line:#2b2b30;--ink:#f6f2ec;--mute:#a9a39a;--orange:#ff7a00;--blue:#2f6bff;--red:#e5322d;
--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Barlow",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg) radial-gradient(#1d1d22 1px,transparent 1.6px) 0 0/9px 9px;color:var(--ink);font:400 16px/1.4 var(--body)}
header{text-align:center;padding:28px 16px 12px}
header img{width:min(260px,62vw);height:auto;display:block;margin:0 auto}
h1{font:italic 900 clamp(34px,8vw,60px)/1 var(--disp);margin:10px 0 4px;color:var(--orange);letter-spacing:.5px}
header p{margin:0;color:var(--mute)}
.legend{display:flex;justify-content:center;gap:18px;margin:14px 0 0;font-size:14px;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 12px 4px;position:sticky;top:env(safe-area-inset-top,0px);background:linear-gradient(var(--bg) 70%,transparent);z-index:2}
nav button{font:600 14px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:999px;cursor:pointer}
nav button[aria-pressed=true]{background:var(--orange);border-color:var(--orange);color:#111}
nav button:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:6px 14px 40px}
section[hidden]{display:none}
h2{font:italic 900 30px/1 var(--disp);margin:26px 0 12px;display:flex;align-items:baseline;gap:10px}
h2 small{font:400 14px var(--body);color:var(--mute)}
.f{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;background:var(--panel);margin:0 0 10px;border-left:5px solid var(--blue);border-right:5px solid var(--red);
clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.side{padding:12px 10px}
.b{text-align:right}
.side b{display:block;font:italic 800 22px/1.05 var(--disp)}
.side span{display:block;font-size:13px;color:var(--mute);margin-top:3px}
.mid{text-align:center;font:italic 900 28px/1 var(--disp);color:var(--orange)}
.mid em{display:block;font:600 11px var(--body);font-style:normal;color:var(--mute);margin-top:2px}
.tag{grid-column:1/-1;margin:0;padding:6px 10px;text-align:center;font-size:13px;color:var(--ink);background:#101013;border-top:1px solid var(--line)}
.tag:empty{display:none}
.jj{color:var(--orange);font-weight:600;font-size:14px}
@media(max-width:480px){.f{grid-template-columns:1fr 48px 1fr}.side b{font-size:19px}.mid{font-size:22px}}
</style>
</head>
